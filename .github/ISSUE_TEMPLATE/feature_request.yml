name: "Feature Request"
description: "Suggest a new feature, tool integration, or enhancement for the suite"
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome community suggestions to improve the CVE Security Operations Suite!
  - type: textarea
    id: problem_statement
    attributes:
      label: Is your feature request related to a problem?
      description: "A clear description of what the problem is."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Describe the solution you'd like
      description: "A clear description of what you want to happen."
    validations:
      required: true
